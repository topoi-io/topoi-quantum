name: Release

# Publishing a GitHub Release is the explicit signal to publish
# the corresponding Topoi Quantum packages to NuGet.org.
#
# Expected release tag format:
#   vMAJOR.MINOR.PATCH
# Example:
#   v0.1.0

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Determine package version
        id: version
        shell: bash
        run: |
          tag="${{ github.event.release.tag_name }}"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the format vMAJOR.MINOR.PATCH, for example v0.1.0."
            exit 1
          fi

          version="${tag#v}"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing Topoi Quantum version $version"

      - name: Restore dependencies
        run: dotnet restore Topoi.Quantum.slnx

      - name: Build
        run: >
          dotnet build Topoi.Quantum.slnx
          --configuration Release
          --no-restore
          -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: >
          dotnet test Topoi.Quantum.Tests/Topoi.Quantum.Tests.csproj
          --configuration Release
          --no-build
          --verbosity normal

      - name: Pack NuGet packages
        run: >
          dotnet pack Topoi.Quantum.slnx
          --configuration Release
          --no-build
          --output artifacts/packages
          -p:Version=${{ steps.version.outputs.version }}

      - name: Verify release packages
        shell: bash
        run: |
          echo "Generated package files:"
          find artifacts/packages -maxdepth 1 -type f -print | sort

          nupkg_count=$(find artifacts/packages -maxdepth 1 -type f -name "*.nupkg" ! -name "*.snupkg" | wc -l)
          snupkg_count=$(find artifacts/packages -maxdepth 1 -type f -name "*.snupkg" | wc -l)

          echo "Primary packages: $nupkg_count"
          echo "Symbol packages:  $snupkg_count"

          if [ "$nupkg_count" -ne 6 ]; then
            echo "Expected 6 .nupkg packages but found $nupkg_count."
            exit 1
          fi

          if [ "$snupkg_count" -ne 6 ]; then
            echo "Expected 6 .snupkg packages but found $snupkg_count."
            exit 1
          fi

      - name: Upload packages as workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-${{ steps.version.outputs.version }}
          path: artifacts/packages/*
          if-no-files-found: error

      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: admin-topoi

      - name: Publish packages to NuGet.org
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --skip-duplicate
